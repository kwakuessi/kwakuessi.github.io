<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apps by [YOUR NAME OR STUDIO NAME]</title>
<meta name="description" content="Mobile apps and games by [YOUR NAME OR STUDIO NAME].">
<style>
  @font-face { font-family: 'Lilita One'; src: url(fonts/lilita-one-400.woff2) format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Nunito'; src: url(fonts/nunito-600.woff2) format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Nunito'; src: url(fonts/nunito-800.woff2) format('woff2'); font-weight: 800; font-display: swap; }
  :root { --ink: #1d2b4f; --muted: #51607f; --paper: #fff8e6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #16324a; color: var(--ink); font-family: Nunito, "Trebuchet MS", system-ui, sans-serif; font-weight: 600; padding: 36px 16px; }
  header { max-width: 640px; margin: 0 auto 22px; color: #fff; }
  h1 { font-family: "Lilita One", Impact, sans-serif; font-weight: 400; font-size: 38px; line-height: 1.1; margin: 0 0 6px; }
  header p { margin: 0; color: #c9d6e6; }
  ul { list-style: none; margin: 0 auto; padding: 0; max-width: 640px; display: grid; gap: 14px; }
  li a { display: flex; gap: 16px; align-items: center; background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 #0b1b2b; padding: 14px 16px; text-decoration: none; color: var(--ink); }
  li a:hover { transform: translateY(-2px); }
  li a:focus-visible { outline: 3px solid #ffcf3f; outline-offset: 3px; }
  li img { width: 72px; height: 72px; border-radius: 16px; border: 2.5px solid var(--ink); flex: none; }
  li b { display: block; font-family: "Lilita One", Impact, sans-serif; font-weight: 400; font-size: 23px; }
  li span { color: var(--muted); font-size: 15px; line-height: 1.4; }
  footer { max-width: 640px; margin: 26px auto 0; color: #c9d6e6; font-size: 14px; }
  footer a { color: #fff; font-weight: 800; }
</style>
</head>
<body>
<header>
  <h1>Apps by [YOUR NAME OR STUDIO NAME]</h1>
  <p>Games and apps made in Ghana.</p>
</header>
<ul>
  <li><a href="hold-the-strait/">
    <img src="hold-the-strait/icon.png" alt="">
    <span><b>Hold the Strait</b>Defend seven of the world's sea straits in a fast, colorful shooting game.</span>
  </a></li>
  <!-- To add another app: copy the <li> block above, change the folder name, icon, title and description. -->
</ul>
<footer>Contact: <a href="mailto:[CONTACT EMAIL]">[CONTACT EMAIL]</a></footer>
</body>
</html>
