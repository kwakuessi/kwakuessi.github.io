<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold the Strait</title>
<meta name="description" content="Hold the Strait: defend seven of the world's sea straits in a fast, colorful mobile shooting game.">
<link rel="icon" href="icon.png">
<style>
  @font-face { font-family: 'Lilita One'; src: url(../fonts/lilita-one-400.woff2) format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Nunito'; src: url(../fonts/nunito-600.woff2) format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Nunito'; src: url(../fonts/nunito-800.woff2) format('woff2'); font-weight: 800; font-display: swap; }
  :root { --ink: #1d2b4f; --muted: #51607f; --paper: #fff8e6; --bg: #0f5d7a; --accent: #ff5a4e; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: linear-gradient(180deg, #1b9fc2, #0f5d7a); color: var(--ink); font-family: Nunito, "Trebuchet MS", system-ui, sans-serif; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 460px; background: var(--paper); border: 3px solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 var(--ink); padding: 30px 24px; text-align: center; }
  img { width: 128px; height: 128px; border-radius: 28px; border: 3px solid var(--ink); }
  h1 { font-family: "Lilita One", Impact, sans-serif; font-weight: 400; font-size: 46px; line-height: 1; margin: 16px 0 8px; color: var(--accent); -webkit-text-stroke: 1.5px var(--ink); }
  p { font-size: 16px; line-height: 1.5; margin: 0 0 14px; }
  .facts { color: var(--muted); font-weight: 800; }
  .stores { display: flex; flex-direction: column; gap: 10px; margin: 20px 0 22px; }
  .stores a { display: block; font-family: "Lilita One", Impact, sans-serif; font-size: 20px; text-decoration: none; color: #fff; background: var(--ink); border-radius: 14px; padding: 11px; }
  .stores a.soon { background: #8792a8; pointer-events: none; }
  nav { display: flex; gap: 18px; justify-content: center; font-weight: 800; font-size: 14px; }
  nav a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Hold the Strait app icon">
  <h1>Hold the Strait</h1>
  <p>Ships are trying to sail through the world's busiest sea straits. Man the coastal guns and stop them before they cross the line.</p>
  <p class="facts">7 straits · 70 waves · 6 weapons</p>
  <div class="stores">
    <!-- When the game is live, replace "#" with the store links and remove class="soon" -->
    <a class="soon" href="#">Google Play: coming soon</a>
    <a class="soon" href="#">App Store: coming soon</a>
  </div>
  <nav><a href="privacy.html">Privacy policy</a><a href="mailto:[CONTACT EMAIL]">Contact</a><a href="../">All apps</a></nav>
</main>
</body>
</html>
